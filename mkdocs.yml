site_name: cobra4
site_description: A high-level, cloud-native language transpiled to Python.
site_url: https://cobra4-lang.github.io/cobra4/
repo_url: https://github.com/cobra4-lang/cobra4
repo_name: cobra4-lang/cobra4
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  logo: assets/logo-128.png
  favicon: assets/cobra4.ico
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/install.md
      - First program: getting-started/first-program.md
      - Development workflow: getting-started/workflow.md
  - Language:
      - Lexicon & syntax: language/lexicon.md
      - Statements: language/statements.md
      - Functions & classes: language/functions.md
      - Pattern matching: language/match.md
      - Smart dispatch: language/smart-dispatch.md
  - Cloud primitives:
      - Read / save IO: cloud/io.md
      - Concurrency: cloud/concurrency.md
      - Daemon mode: cloud/serve.md
      - Fleet & secrets: cloud/fleet.md
      - Deploy adapters: cloud/deploy.md
  - Plugins:
      - Authoring a language plugin: plugins/authoring.md
      - SQL / regex / yaml: plugins/builtin.md
  - Tooling:
      - CLI reference: tooling/cli.md
      - Cobra4 Studio: tooling/idle.md
      - LSP / IDE setup: tooling/lsp.md
      - Test framework: tooling/test.md
  - Examples:
      - Overview: examples/index.md
      - Word count: examples/wordcount.md
      - Health check: examples/healthcheck.md
      - ETL: examples/etl.md
      - HTTP serve: examples/serve.md
      - Schedule: examples/schedule.md
      - Fleet: examples/fleet.md
      - SQL plugin: examples/sql.md
      - Stdlib dogfood: examples/stdlib.md
      - Log analyzer: examples/log-analyzer.md
      - Webhook router: examples/webhook-router.md
  - Reference:
      - Changelog: reference/changelog.md
      - Stdlib API: reference/stdlib.md
      - Environment variables: reference/env.md
      - AI assistants guide: reference/ai-helper.md
  - RFCs:
      - "0001 — Effect / capability system": rfc/0001-effect-system.md
      - "0002 — Workflow orchestration": rfc/0002-workflow-orchestration.md
      - "0003 — Infra-as-code": rfc/0003-infra-as-code.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

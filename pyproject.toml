[build-system]
requires = ["setuptools>=68,<77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cobra4"
version = "0.6.2"
description = "A high-level, cloud-native language transpiled to Python."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "cobra4 authors" }]
keywords = [
    "language", "transpiler", "compiler", "dsl",
    "cloud", "cloud-native", "automation",
    "lsp", "smart-dispatch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "lark>=1.1.9",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/cobra4-lang/cobra4"
Repository = "https://github.com/cobra4-lang/cobra4"
Issues = "https://github.com/cobra4-lang/cobra4/issues"
Changelog = "https://github.com/cobra4-lang/cobra4/blob/main/CHANGELOG.md"

[project.optional-dependencies]
aws = ["boto3>=1.34"]
data = ["pandas>=2.1", "pyarrow>=15.0"]
ssh = ["paramiko>=3.4"]
yaml = ["pyyaml>=6.0"]
sql = ["sqlalchemy>=2.0"]
llm = ["anthropic>=0.34"]
graphql = ["graphql-core>=3.2"]
prom = ["prometheus-client>=0.20"]
redis = ["redis>=5.0"]
vault = ["hvac>=2.0"]
gcp = ["google-cloud-secret-manager>=2.20"]
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
]
dev = ["pytest>=8.0", "black>=24.0"]

[project.scripts]
cobra4 = "cobra4.cli:main"
c4 = "cobra4.cli:main"

[tool.setuptools]
license-files = []

[tool.setuptools.packages.find]
include = ["cobra4*"]

[tool.setuptools.package-data]
"cobra4" = ["*.lark"]
"cobra4.stdlib" = ["*.c4"]
"cobra4.assets" = ["*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

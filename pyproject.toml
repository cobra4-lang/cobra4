[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cobra4"
version = "0.1.0"
description = "cobra4 - high-level cloud-native language transpiled to Python"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "cobra4 authors" }]
keywords = ["language", "transpiler", "cloud", "dsl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "lark>=1.1.9",
    "requests>=2.31",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
data = ["pandas>=2.1", "pyarrow>=15.0"]
ssh = ["paramiko>=3.4"]
yaml = ["pyyaml>=6.0"]
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
]
dev = ["pytest>=8.0", "black>=24.0"]

[project.scripts]
cobra4 = "cobra4.cli:main"
c4 = "cobra4.cli:main"

[tool.setuptools.packages.find]
include = ["cobra4*"]

[tool.setuptools.package-data]
cobra4 = ["*.lark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

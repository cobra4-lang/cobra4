name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,yaml]"

      - name: Check local install
        run: c4 doctor

      - name: Run tests
        run: pytest -q

      - name: Lint examples with c4 check
        run: |
          for f in examples/*.c4; do
            echo "::group::c4 check $f"
            c4 check "$f"
            echo "::endgroup::"
          done

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install --upgrade build

      - name: Build distributions
        run: python -m build

      - name: Smoke install wheel
        run: |
          python -m venv /tmp/cobra4-wheel-smoke
          /tmp/cobra4-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/cobra4-wheel-smoke/bin/c4 --version
          printf 'fn main() { log("ok") }\nmain()\n' > /tmp/cobra4-smoke.c4
          /tmp/cobra4-wheel-smoke/bin/c4 check /tmp/cobra4-smoke.c4

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7
